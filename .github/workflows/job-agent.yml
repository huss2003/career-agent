name: Job agent

# Budget-capped job hunt: career-ops tooling powered by lean Claude API calls (Sonnet, hard daily $ cap).
#   - every morning (scheduled): freehire scan → evaluate until 20 jobs score 4.0+ with a passing CV,
#     the daily budget is reached, or 07:45 IST; then Telegram delivery before 8 AM
#   - files pushed to inbox/: job URLs or pasted JDs (the Claude app, GitHub mobile, or the Indeed feed)
#   - manual run: Actions tab → Job agent → Run workflow
# Results are committed back to profile/: reports, tracker, ATS CVs, designed CVs, application kits, spend ledger.

on:
  push:
    branches: [main]
    paths: ["inbox/**"]
  schedule:
    - cron: "41 0 * * *" # 06:11 IST — results arrive on Telegram before 8 AM
  workflow_dispatch:
    inputs:
      url:
        description: "Evaluate one job URL (optional)"
        required: false
        default: ""
      scan:
        description: "Run the freehire hunt"
        type: boolean
        default: true
      max_evals:
        description: "Max evaluations this run (blank = agent.config.json)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: job-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CAREER_OPS_DIR: .career-ops
      CAREER_OPS_ROOT: ${{ github.workspace }}/profile
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - name: Check the API key secret
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add your Claude API key as a repository secret named ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch career-ops (pinned) + overlay
        run: |
          git clone --filter=blob:none --quiet https://github.com/career-ops-hq/career-ops "$CAREER_OPS_DIR"
          git -C "$CAREER_OPS_DIR" checkout --quiet "$(cat .career-ops-ref)"
          cp -r overlay/templates/. "$CAREER_OPS_DIR/templates/"
          mkdir -p "$CAREER_OPS_DIR/batch"
          echo "career-ops $(git -C "$CAREER_OPS_DIR" rev-parse --short HEAD) ($(cut -d' ' -f1 "$CAREER_OPS_DIR/VERSION"))"

      - name: Cache browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('.career-ops-ref', 'requirements.txt') }}-v2

      - name: Install tools
        run: |
          (cd "$CAREER_OPS_DIR" && npm install --no-audit --no-fund --silent && npx playwright install --with-deps chromium chromium-headless-shell)
          npm install -g @anthropic-ai/claude-code --silent
          pip install --quiet -r requirements.txt
          python -m playwright install chromium
          claude --version

      - name: Collect jobs you sent (inbox, manual URL)
        env:
          INPUT_URL: ${{ github.event.inputs.url }}
        run: |
          if [ -n "$INPUT_URL" ]; then mkdir -p inbox && printf '%s\n' "$INPUT_URL" > "inbox/manual-$(date +%s).md"; fi
          node scripts/inbox-intake.mjs

      - name: Hunt (lean Claude calls, hard daily budget)
        env:
          INPUT_MAX: ${{ github.event.inputs.max_evals }}
        run: |
          FLAG="$CAREER_OPS_DIR/batch/scan-requested"
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="--scan --deadline-ist 07:45"; fi
          if [ "${{ github.event.inputs.scan }}" = "true" ] || [ -f "$FLAG" ]; then ARGS="$ARGS --scan"; fi
          [ -s "$FLAG" ] && INPUT_MAX="$(cat "$FLAG")"
          [ -n "$INPUT_MAX" ] && ARGS="$ARGS --max-evals $INPUT_MAX"
          node scripts/lean-hunt.mjs $ARGS

      - name: Render designed CVs and application kits (no tokens)
        run: |
          python scripts/render-designed.py
          python scripts/render-kits.py

      - name: Send new jobs to Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/notify-telegram.mjs

      - name: Commit results
        if: always()
        run: |
          git config user.name "job-agent"
          git config user.email "job-agent@users.noreply.github.com"
          git add -A profile inbox
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "$(cat "$CAREER_OPS_DIR/batch/commit-line" 2>/dev/null || echo 'agent run')"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          echo "::error::could not push results"; exit 1
